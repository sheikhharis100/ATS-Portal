# Render Blueprint for the ATS backend.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Render reads this file and creates the service automatically.
#
# The values marked sync:false are NOT stored in this file (it is committed to
# a public repo). Render prompts for them during setup, or you set them later
# under Service -> Environment.
services:
  - type: web
    name: ats-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: mini-services/ats-backend
    buildCommand: npm install
    startCommand: node index.js
    # Render pings this to decide whether the service is healthy.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"

      # MongoDB Atlas connection string.
      # Atlas -> Network Access must allow 0.0.0.0/0 for Render to connect.
      - key: MONGO_URI
        sync: false

      # Generated by Render on first deploy; never reuse the local one.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d

      # Comma-separated list of allowed frontend origins.
      # Any *.vercel.app origin is also allowed (see index.js).
      - key: CLIENT_URL
        sync: false

      # Public URL of this service, used to build upload URLs.
      - key: PUBLIC_API_URL
        sync: false

      # Cloudinary. Required in production: Render's disk is ephemeral, so the
      # local-disk upload fallback would lose files on every restart/redeploy.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Optional. Emails are skipped when these are unset.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_PASS
        sync: false
